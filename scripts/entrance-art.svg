<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- 밝은 체육관: 사람·글자·로고 없음. 장식 입구 이미지 전용 -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6e8"/>
      <stop offset="1" stop-color="#f3e8cf"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eccf98"/>
      <stop offset="1" stop-color="#e0b978"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 뒷벽과 바닥 -->
  <rect width="1200" height="400" fill="url(#wall)"/>
  <rect y="400" width="1200" height="230" fill="url(#floor)"/>
  <rect y="396" width="1200" height="10" fill="#d9b273"/>

  <!-- 바닥 판자 -->
  <g stroke="#d3aa6c" stroke-width="3" opacity="0.55">
    <line x1="0" y1="448" x2="1200" y2="448"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="556" x2="1200" y2="556"/>
    <line x1="0" y1="616" x2="1200" y2="616"/>
  </g>

  <!-- 높은 창 세 개 -->
  <g>
    <rect x="120" y="64" width="200" height="150" rx="14" fill="#fdfbf2" stroke="#e0d2ae" stroke-width="6"/>
    <rect x="500" y="52" width="220" height="162" rx="14" fill="#fdfbf2" stroke="#e0d2ae" stroke-width="6"/>
    <rect x="900" y="64" width="200" height="150" rx="14" fill="#fdfbf2" stroke="#e0d2ae" stroke-width="6"/>
    <g stroke="#e0d2ae" stroke-width="4">
      <line x1="220" y1="64" x2="220" y2="214"/>
      <line x1="610" y1="52" x2="610" y2="214"/>
      <line x1="1000" y1="64" x2="1000" y2="214"/>
    </g>
    <polygon points="500,214 720,214 840,400 380,400" fill="url(#light)"/>
  </g>

  <!-- 벽 보호대 -->
  <rect y="330" width="1200" height="16" fill="#d99a55" opacity="0.8"/>

  <!-- 코트 라인 -->
  <g stroke="#ffffff" stroke-width="9" opacity="0.95" fill="none">
    <line x1="0" y1="452" x2="1200" y2="452"/>
    <ellipse cx="600" cy="560" rx="170" ry="52"/>
    <path d="M 240 630 Q 300 500 430 452"/>
    <path d="M 960 630 Q 900 500 770 452"/>
  </g>

  <!-- 농구공 -->
  <g transform="translate(250 540)">
    <circle r="52" fill="#e8843c" stroke="#b85a1f" stroke-width="5"/>
    <path d="M -52 0 H 52 M 0 -52 V 52 M -37 -37 Q 0 0 37 37 M -37 37 Q 0 0 37 -37" stroke="#b85a1f" stroke-width="5" fill="none"/>
  </g>

  <!-- 콘 두 개 -->
  <g fill="#e06a2b" stroke="#b34d1a" stroke-width="4">
    <path d="M 830 600 L 856 508 Q 862 494 868 508 L 894 600 Z"/>
    <path d="M 930 616 L 952 544 Q 958 532 964 544 L 986 616 Z"/>
  </g>

  <!-- 벤치 -->
  <g>
    <rect x="1000" y="470" width="170" height="18" rx="9" fill="#c98a4b"/>
    <rect x="1012" y="488" width="12" height="46" rx="5" fill="#b3763b"/>
    <rect x="1146" y="488" width="12" height="46" rx="5" fill="#b3763b"/>
  </g>

  <!-- 공동 보관대의 공들 -->
  <g>
    <rect x="60" y="300" width="14" height="96" rx="7" fill="#b3763b"/>
    <circle cx="120" cy="316" r="22" fill="#e8843c" stroke="#b85a1f" stroke-width="4"/>
    <circle cx="168" cy="316" r="22" fill="#7fa8d9" stroke="#4d76a8" stroke-width="4"/>
    <circle cx="216" cy="316" r="22" fill="#7fbf9e" stroke="#4d8a6a" stroke-width="4"/>
    <rect x="94" y="338" width="150" height="10" rx="5" fill="#b3763b"/>
  </g>

  <!-- 부드러운 빛 표현 -->
  <circle cx="1080" cy="120" r="70" fill="#ffffff" opacity="0.35"/>
  <circle cx="90" cy="90" r="46" fill="#ffffff" opacity="0.3"/>
</svg>
